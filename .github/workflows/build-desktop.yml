name: Build Desktop (Windows + macOS)

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: "Global Release Version (e.g., 1.0.1) - uploads single build to S3"
        required: false
        type: string
      client_id:
        description: "The specific client ID to build for (e.g., client_A) (Legacy)"
        required: false
        type: string
      api_base_url:
        description: "Backend base URL (e.g. https://api.example.com). Leave empty to build demo mode."
        required: false
        type: string
      demo_mode:
        description: "Build with PAPER_DEMO_MODE=true (ignores backend)"
        required: false
        default: false
        type: boolean
  push:
    branches: [ "main" ]

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            os: windows-latest
          - target: macos
            os: macos-latest

    env:
      # If you want CI builds to always point at a backend, set this repository secret:
      #   PAPER_API_BASE_URL
      # Push builds always use the secret (no demo fallback).
      #
      # Optional testing convenience: set PAPER_AUTO_LOGIN_EMAIL and
      # PAPER_AUTO_LOGIN_PASSWORD secrets to bake auto-login into API builds
      # (skips the login screen; credentials end up inside the binary, so use
      # only for internal testing). Without them, auto-login is disabled so
      # builds never probe the backend with default dev credentials.
      INPUT_API_BASE_URL: ${{ inputs.api_base_url }}
      INPUT_DEMO_MODE: ${{ inputs.demo_mode }}
      INPUT_CLIENT_ID: ${{ inputs.client_id }}
      SECRET_API_BASE_URL: ${{ secrets.PAPER_API_BASE_URL }}
      SECRET_AUTO_LOGIN_EMAIL: ${{ secrets.PAPER_AUTO_LOGIN_EMAIL }}
      SECRET_AUTO_LOGIN_PASSWORD: ${{ secrets.PAPER_AUTO_LOGIN_PASSWORD }}
      SECRET_SENTRY_DSN: ${{ secrets.PAPER_SENTRY_DSN }}
      SECRET_APPCAST_URL: ${{ secrets.PAPER_APPCAST_URL }}

    steps:
      - uses: actions/checkout@v4



      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Decide build flags
        id: flags
        shell: bash
        run: |
          set -euo pipefail
          EVENT_NAME="${GITHUB_EVENT_NAME:-}"

          # Auto-login defines for API builds: use the secrets when both are
          # set, otherwise disable auto-login entirely.
          if [[ -n "${SECRET_AUTO_LOGIN_EMAIL:-}" && -n "${SECRET_AUTO_LOGIN_PASSWORD:-}" ]]; then
            AUTO_LOGIN_DEFINES="--dart-define=PAPER_AUTO_LOGIN_EMAIL=${SECRET_AUTO_LOGIN_EMAIL} --dart-define=PAPER_AUTO_LOGIN_PASSWORD=${SECRET_AUTO_LOGIN_PASSWORD}"
          else
            AUTO_LOGIN_DEFINES="--dart-define=PAPER_AUTO_LOGIN=false"
          fi

          if [[ "${EVENT_NAME}" == "push" ]]; then
            API_URL="${SECRET_API_BASE_URL:-}"
            if [[ -z "${API_URL}" ]]; then
              echo "Missing required repo secret PAPER_API_BASE_URL for push builds."
              exit 1
            fi
            echo "dart_defines=--dart-define=PAPER_API_BASE_URL=${API_URL} ${AUTO_LOGIN_DEFINES} --dart-define=PAPER_SENTRY_DSN=${SECRET_SENTRY_DSN:-} --dart-define=PAPER_APPCAST_URL=${SECRET_APPCAST_URL:-}" >> "$GITHUB_OUTPUT"
            echo "label=api" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # workflow_dispatch: allow explicit demo builds or overrides
          API_URL="${INPUT_API_BASE_URL:-${SECRET_API_BASE_URL:-}}"
          DEMO="${INPUT_DEMO_MODE:-false}"
          CLIENT_DEFINE=""
          if [[ -n "${INPUT_CLIENT_ID:-}" ]]; then
            CLIENT_DEFINE="--dart-define=CLIENT_ID=${INPUT_CLIENT_ID}"
          fi

          if [[ "${DEMO}" == "true" ]]; then
            echo "dart_defines=--dart-define=PAPER_DEMO_MODE=true ${CLIENT_DEFINE} --dart-define=PAPER_SENTRY_DSN=${SECRET_SENTRY_DSN:-} --dart-define=PAPER_APPCAST_URL=${SECRET_APPCAST_URL:-}" >> "$GITHUB_OUTPUT"
            echo "label=demo" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "${API_URL}" ]]; then
            echo "No API base URL provided and PAPER_API_BASE_URL secret is missing."
            exit 1
          fi

          echo "dart_defines=--dart-define=PAPER_API_BASE_URL=${API_URL} ${CLIENT_DEFINE} ${AUTO_LOGIN_DEFINES} --dart-define=PAPER_SENTRY_DSN=${SECRET_SENTRY_DSN:-} --dart-define=PAPER_APPCAST_URL=${SECRET_APPCAST_URL:-}" >> "$GITHUB_OUTPUT"
          echo "label=api" >> "$GITHUB_OUTPUT"

      - name: Build (Windows)
        if: matrix.target == 'windows'
        run: flutter build windows --release ${{ steps.flags.outputs.dart_defines }}

      - name: Package (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $outDir = "dist"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          $src = "build/windows/x64/runner/Release"
          if (!(Test-Path $src)) { throw "Expected build output at $src" }

          $zipPath = Join-Path $outDir ("paper-windows-${{ steps.flags.outputs.label }}.zip")
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path (Join-Path $src "*") -DestinationPath $zipPath

      - name: Upload (Windows Artifact)
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: paper-windows-${{ steps.flags.outputs.label }}
          path: dist/*.zip

      - name: Upload Single Build via EC2 to S3 (Windows)
        if: matrix.target == 'windows' && github.event.inputs.target_version != ''
        env:
          EC2_HOST: ${{ secrets.AWS_EC2_HOST }}
          EC2_USER: ${{ secrets.AWS_SSH_USER }}
          EC2_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
          S3_BUCKET: ${{ secrets.AWS_S3_UPDATE_BUCKET }}
        shell: bash
        run: |
          if [[ -z "${EC2_HOST}" || -z "${EC2_USER}" || -z "${EC2_SSH_KEY}" || -z "${S3_BUCKET}" ]]; then
            echo "Missing EC2 SSH or AWS_S3_UPDATE_BUCKET secrets."
            exit 1
          fi
          
          # Setup SSH key securely
          mkdir -p ~/.ssh
          echo "${EC2_SSH_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${EC2_HOST}" >> ~/.ssh/known_hosts
          
          VERSION="${{ github.event.inputs.target_version }}"
          EXE_NAME="paper-windows-v${VERSION}.exe"
          
          echo "Transferring file to EC2..."
          scp "build/windows/x64/runner/Release/paper.exe" "${EC2_USER}@${EC2_HOST}:~/${EXE_NAME}"
          
          echo "Uploading from EC2 to S3..."
          # The EC2 instance will use its IAM role to run the S3 copy, then clean up the file
          ssh "${EC2_USER}@${EC2_HOST}" "aws s3 cp ~/${EXE_NAME} s3://${S3_BUCKET}/${VERSION}/${EXE_NAME} --acl public-read && rm ~/${EXE_NAME}"


      # Some plugins (auto_updater_macos, printing) don't support Swift Package
      # Manager, and SPM resolves a sentry-cocoa that lacks an API sentry_flutter
      # calls (binaryImageCache.image). Force the CocoaPods path, which pins a
      # compatible native Sentry version.
      - name: Disable Swift Package Manager (macOS)
        if: matrix.target == 'macos'
        run: flutter config --no-enable-swift-package-manager

      - name: Build (macOS)
        if: matrix.target == 'macos'
        run: flutter build macos --release ${{ steps.flags.outputs.dart_defines }}

      - name: Package (macOS DMG)
        if: matrix.target == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="build/macos/Build/Products/Release/paper.app"
          if [[ ! -d "${APP_PATH}" ]]; then
            echo "Expected app bundle at ${APP_PATH}"
            ls -la "build/macos/Build/Products/Release" || true
            exit 1
          fi

          mkdir -p dist
          DMG_PATH="dist/paper-macos-${{ steps.flags.outputs.label }}.dmg"

          # Create a simple unsigned DMG (good for demos/internal distribution).
          hdiutil create -volname "Paper" -srcfolder "${APP_PATH}" -ov -format UDZO "${DMG_PATH}"

      - name: Upload (macOS)
        if: matrix.target == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: paper-macos-${{ steps.flags.outputs.label }}
          path: dist/*.dmg
