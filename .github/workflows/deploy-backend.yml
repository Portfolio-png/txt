name: Deploy Node.js Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'packages/core_erp/lib/core/services/feature_flags.dart'
      - 'bin/generate_registry.dart'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm install

      - name: Run Backend Tests
        working-directory: ./backend
        run: npm test

      - name: Export Feature Registry
        run: dart bin/generate_registry.dart

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_SSH_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          source: "backend"
          target: "txt"

      - name: Configure backend .env on EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          PAPER_S3_BUCKET_NAME: ${{ secrets.PAPER_S3_BUCKET_NAME }}
          PAPER_S3_REGION: ${{ secrets.PAPER_S3_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_SSH_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          envs: PAPER_S3_BUCKET_NAME,PAPER_S3_REGION,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY
          script: |
            cd txt/backend
            touch .env
            # Idempotent upsert: replace only these keys, preserve everything else in .env
            upsert_env() {
              key="$1"; val="$2"
              if [ -z "$val" ]; then return 0; fi   # skip unset secrets, don't shadow IAM role
              grep -v "^${key}=" .env > .env.tmp 2>/dev/null || true
              mv .env.tmp .env
              printf '%s=%s\n' "$key" "$val" >> .env
            }
            upsert_env PAPER_S3_BUCKET_NAME "$PAPER_S3_BUCKET_NAME"
            upsert_env PAPER_S3_REGION "$PAPER_S3_REGION"
            upsert_env AWS_ACCESS_KEY_ID "$AWS_ACCESS_KEY_ID"
            upsert_env AWS_SECRET_ACCESS_KEY "$AWS_SECRET_ACCESS_KEY"
            chmod 600 .env

      - name: Install Dependencies and Restart PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_SSH_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            cd txt/backend
            npm install --omit=dev
            pm2 restart all --update-env || pm2 start server.js
