name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_path:
        description: "The path of the app to build"
        required: true
        default: "apps/challan_mobile"
        type: choice
        options:
          - "apps/challan_mobile"
          - "apps/challans_only"
          - "."
      api_base_url:
        description: "Backend base URL (e.g. http://16.171.150.193:18080). Leave empty to use secret or default."
        required: false
        type: string
      demo_mode:
        description: "Build with PAPER_DEMO_MODE=true (ignores login)"
        required: false
        default: false
        type: boolean
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      INPUT_API_BASE_URL: ${{ inputs.api_base_url }}
      INPUT_DEMO_MODE: ${{ inputs.demo_mode }}
      SECRET_API_BASE_URL: ${{ secrets.PAPER_API_BASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            cd ${{ inputs.app_path }}
          else
            cd apps/challan_mobile
          fi
          flutter pub get
          cd -

      - name: Build APK
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            cd ${{ inputs.app_path }}
            DEMO="${{ env.INPUT_DEMO_MODE }}"
            API_URL="${{ env.INPUT_API_BASE_URL }}"
          else
            cd apps/challan_mobile
            DEMO="false"
            API_URL=""
          fi
          
          if [ -z "$API_URL" ]; then
            API_URL="${{ env.SECRET_API_BASE_URL }}"
          fi
          if [ -z "$API_URL" ]; then
            API_URL="http://16.171.150.193:18080"
          fi
          
          DEFINES=""
          if [ "$DEMO" == "true" ]; then
            DEFINES="--dart-define=PAPER_DEMO_MODE=true"
          else
            DEFINES="--dart-define=PAPER_DEMO_MODE=false --dart-define=PAPER_API_BASE_URL=${API_URL}"
          fi
          
          echo "Building with defines: $DEFINES"
          flutter build apk --release $DEFINES --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: |
            apps/challan_mobile/build/app/outputs/flutter-apk/app-release.apk
            apps/challans_only/build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk

      - name: Publish to GitHub Releases
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.sha }}"
          name: "Build (${{ github.sha }})"
          files: |
            apps/challan_mobile/build/app/outputs/flutter-apk/app-release.apk
            apps/challans_only/build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk
